# p4monitor_locks.yaml - configuration for monitor_locks.py
#
# Pass this file to the script with: monitor_locks.py --config p4monitor_locks.yaml
#
# Requires pyyaml: pip install pyyaml
# Keep credentials in p4monitor_locks.env (created with mode 0600 by the installer)
# and reference them with the explicit *_env settings below.

notifications:
  # Minimum number of blocked commands before any notification is sent.
  min_blocked_commands: 5

  # Seconds to wait between repeat notifications (avoids flooding).
  cooldown_seconds: 300

  # File used to track the timestamp of the last notification.
  # Must be writable by the user running monitor_locks.py.
  state_file: "/tmp/p4monitor_locks.notify.state"

  # Optional text shown as the first line after the title in chat notifications.
  # Example: "Investigate lock contention immediately"
  notification_text: ""

  # Optional URL used to render an "Open Runbook" button in Slack notifications.
  runbook_url: ""

  # Maximum lines for Slack/Teams chat payloads (summary + blocking tree).
  # Set to 0 for no line limit.
  max_lines: 40

  # ---------------------------------------------------------------------------
  # Slack - post to an Incoming Webhook URL, or use the Web API with a bot token.
  # ---------------------------------------------------------------------------
  slack:
    enabled: false
    # Set mode to "bot" to post with chat.postMessage. Bot mode does not need
    # a public URL. The bot must have chat:write and be in the target channel.
    # See the sample slack_manifest.json for an example Slack App configuration.
    # This needs to be created by you and installed in your Slack Workspace by your admins.
    # mode: "bot"
    # bot_token_env: "P4MONITOR_SLACK_BOT_TOKEN"
    # channel_id: "C0123456789"
    # When a later run finds fewer blocked commands, bot mode replies in the
    # original alert thread with the updated blocking tree.
    # Create a webhook at https://api.slack.com/messaging/webhooks
    # webhook_url_env: "P4MONITOR_SLACK_WEBHOOK_URL"
    # Optional override of notifications.max_lines for Slack only.
    # max_lines: 40
    # Message style: "simple" (default, JSON tree) or "detailed" (server info,
    # lock start/detected/duration timing, and a box-drawing tree per root blocker).
    # style: "detailed"

  # ---------------------------------------------------------------------------
  # Email - send via SMTP
  # ---------------------------------------------------------------------------
  email:
    enabled: false
    smtp_host: "localhost"
    smtp_port: 25
    # Set use_tls: true to use STARTTLS (recommended for port 587)
    use_tls: false
    # Leave username/password empty for unauthenticated relay
    username: ""
    # password_env: "P4MONITOR_SMTP_PASSWORD"
    from_addr: "p4monitor@example.com"
    to_addrs:
      - "admin@example.com"
    subject: "P4 Lock Alert"

  # ---------------------------------------------------------------------------
  # Microsoft Teams - post to an Incoming Webhook connector
  # ---------------------------------------------------------------------------
  teams:
    enabled: false
    # Create a webhook in Teams: Channel > Connectors > Incoming Webhook
    # webhook_url_env: "P4MONITOR_TEAMS_WEBHOOK_URL"
    # Optional override of notifications.max_lines for Teams only.
    # max_lines: 40

  # ---------------------------------------------------------------------------
  # Generic script - called with JSON payload on stdin
  #
  # The script receives a JSON object with these fields:
  #   {
  #     "blocked_count": <int>,
  #     "blockers":  [ <summary line>, ... ],
  #     "details":   [ <per-lock detail line>, ... ],
  #     "blocking_tree": <dict>
  #   }
  #
  # Exit 0 to indicate success.  Any other exit code is logged as a warning.
  # ---------------------------------------------------------------------------
  script:
    enabled: false
    command: "/usr/local/bin/p4_lock_notify.sh"
